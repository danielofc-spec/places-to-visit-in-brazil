<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PVB - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/sign-in.css" />
  </head>
  <body>
    <header>
      <div class="logo-sign">
        <h1>Places to visit in Brazil</h1>
        <a href="sign-up.html"> Sign Up </a>
      </div>
    </header>
    <main class="container">
      <div class="login-text">
        <div>
          <h2>New here?</h2>
        </div>
        <div>
          <p>Create an account to save you favorites</p>
        </div>
      </div>
      <div class="sign">
        <form method="post" action="../index.html" class="sign-in">
          <div class="sign-in-input">
            <div class="sign-in-input">
              <label for="email">Username</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Alex"
                required
              />
            </div>
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="user@email.com"
              required
            />
          </div>
          <div class="sign-in-input">
            <label for="email">Phone</label>
            <input
              type="text"
              id="phone"
              name="phone"
              placeholder="(11) 98765-4321"
              required
            />
          </div>
          <div class="sign-in-input">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>

          <button type="submit" class="sign-in-btn">Sign-up</button>
        </form>
      </div>
    </main>
  </body>
</html>
